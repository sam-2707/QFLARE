apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'High'
      disableMetricsLookup: false
      incrementalQuerying: false
      incrementalQueryOverlapWindow: 10m
      queryTimeout: 60s
      timeInterval: 30s
      tlsSkipVerify: false
    secureJsonData: {}

  - name: QFLARE-SQLite
    type: frser-sqlite-datasource
    access: proxy
    url: file:/var/lib/grafana/data/performance_metrics.db
    isDefault: false
    editable: true
    jsonData:
      path: /var/lib/grafana/data/performance_metrics.db
    secureJsonData: {}

  - name: QFLARE-Logs
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "trace_id=(\\w+)"
          name: "TraceID"
          url: "$${__value.raw}"
    secureJsonData: {}

  - name: QFLARE-Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    editable: true
    jsonData:
      implementation: prometheus
    secureJsonData: {}